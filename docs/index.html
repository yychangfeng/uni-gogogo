<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="wit-go">
<meta name="theme-color" content="#f4f6fa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>wit-go 课表</title>
<style>
  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #f4f6fa;
    --line: #e9edf4;
    --t1: #1f2733;
    --t2: #6b7484;
    --t3: #98a2b3;
    --blue: #2f6fed;
  }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--t1);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    padding-bottom: var(--safe-bottom);
  }

  header {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: calc(8px + var(--safe-top)) 12px 8px;
    background: #fff; position: relative;
  }
  .brand { display: flex; align-items: center; gap: 7px; }
  .brand img { width: 26px; height: 26px; border-radius: 8px; }
  .brand b { font-size: 13px; letter-spacing: .2px; }
  .wk { position: absolute; left: 0; right: 0; text-align: center; pointer-events: none; }
  .wk b { font-size: 17px; }
  .wk span { display: block; font-size: 11px; color: var(--t3); margin-top: 1px; }
  .wk em {
    position: absolute; left: 100%; top: 4px; margin-left: 6px;
    font-style: normal; font-size: 10px; color: #d97706; white-space: nowrap;
    background: #fef3c7; border-radius: 8px; padding: 1px 6px;
  }
  .wkno { position: relative; display: inline-block; }
  .acts { margin-left: auto; display: flex; gap: 6px; }
  .ibtn {
    width: 32px; height: 32px; border: 0; border-radius: 10px;
    background: #fff; color: #3d4757; font-size: 15px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 3px rgba(20,30,50,.08);
  }
  .ibtn:active { opacity: .55; }
  .pill {
    border: 0; border-radius: 9px; background: #eef3fd; color: var(--blue);
    font-size: 11.5px; padding: 0 8px; height: 30px;
  }
  .pill:active { opacity: .6; }

  .body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 0 0 0; }
  .grid { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .dow { flex: none; display: flex; height: 42px; background: #fff; overflow: hidden; }
  .corner { width: 30px; flex: none; }
  .dh { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 11px; }
  .dh span { font-size: 9.5px; color: var(--t3); }
  .dh.today b { color: #e8681c; }
  .rows { flex: 1; min-height: 0; min-width: 0; display: flex; position: relative; overflow: hidden; }
  .gutter { width: 30px; flex: none; position: relative; }
  .gl { position: absolute; left: 0; right: 0; text-align: center; font-size: 9px; color: var(--t3); line-height: 1.15; }
  .gl b { display: block; font-size: 10px; color: #5b6879; }
  .cols { flex: 1; min-width: 0; display: flex; position: relative; }
  .col { flex: 1; min-width: 0; position: relative; border-left: 1px solid var(--line); overflow: hidden; }
  .col:last-child { border-right: 1px solid var(--line); }
  .hline { position: absolute; left: 30px; right: 0; height: 1px; background: var(--line); pointer-events: none; }
  .blk[data-c="0"] { background:#fdf1e3; border-left-color:#e8a33d; color:#7a5320; }
  .blk[data-c="1"] { background:#eaf1fd; border-left-color:#4f8bf7; color:#274b8f; }
  .blk[data-c="2"] { background:#eaf7ef; border-left-color:#35a06a; color:#1f6a47; }
  .blk[data-c="3"] { background:#fdecec; border-left-color:#e2685c; color:#8c3a34; }
  .blk[data-c="4"] { background:#f2edfc; border-left-color:#7b61d6; color:#4a3a8c; }
  .blk[data-c="5"] { background:#e9f6f8; border-left-color:#39a3b5; color:#236b78; }  .blk {
    position: absolute; border-radius: 7px; padding: 2px 3px; overflow: hidden;
    font-size: 9.5px; line-height: 1.22; color: #5b4423;
    background: #fdf1e3; border-left: 2px solid #e8a33d;
  }
  .blk .nm { font-weight: 700; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .blk .rm { font-size: 8.5px; opacity: .72; margin-top: 1px; }
  .blk .tc { font-size: 8px; opacity: .6; }
  .col.today { background: rgba(255,247,237,.7); }

  .foot {
    flex: none; padding: 8px 12px calc(8px + var(--safe-bottom));
    font-size: 10.5px; color: var(--t3); text-align: center; background: #fff;
  }
  .foot b { color: var(--t2); font-weight: 600; }

  /* 空态 */
  .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
  .empty img { width: 84px; height: 84px; border-radius: 22px; }
  .empty h2 { margin: 0; font-size: 17px; }
  .empty p { margin: 0; font-size: 12.5px; line-height: 1.7; color: var(--t2); max-width: 300px; }
  .cta {
    border: 0; border-radius: 12px; background: var(--blue); color: #fff;
    font-size: 14px; font-weight: 700; padding: 12px 30px; margin-top: 4px;
  }
  .cta:active { opacity: .85; }

  /* 菜单 / 详情 */
  .mask { position: fixed; inset: 0; background: rgba(15,20,30,.35); opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 20; }
  .mask.on { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    background: #fff; border-radius: 18px 18px 0 0;
    padding: 8px 14px calc(16px + var(--safe-bottom));
    transform: translateY(110%); transition: transform .24s cubic-bezier(.2,.8,.3,1);
  }
  .sheet.on { transform: translateY(0); }
  .grab { width: 38px; height: 4px; border-radius: 2px; background: #dfe4ec; margin: 0 auto 10px; }
  .shTitle { font-size: 14px; font-weight: 700; margin: 2px 0 10px; }
  .opt { width: 100%; border: 0; background: #f6f8fc; border-radius: 12px; text-align: left; padding: 12px 13px; margin-bottom: 8px; font-size: 13.5px; color: var(--t1); }
  .opt:active { background: #eef2f9; }
  .opt small { display: block; font-size: 11px; color: var(--t3); margin-top: 3px; }
  .wks { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
  .wkcell { border: 0; border-radius: 9px; background: #f4f7fc; padding: 9px 0; font-size: 12.5px; color: var(--t1); }
  .wkcell.cur { background: var(--blue); color: #fff; font-weight: 700; }

  .det { padding: 2px 2px 6px; }
  .det h3 { margin: 0 0 2px; font-size: 16px; }
  .det .sub { font-size: 11.5px; color: var(--t3); margin-bottom: 10px; }
  .det .time { background: #f4f7fc; border-radius: 10px; padding: 9px 12px; font-size: 17px; font-weight: 700; margin-bottom: 10px; }
  .det .time small { font-size: 11px; font-weight: 400; color: var(--t3); margin-left: 6px; }
  .det .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .det .kv div { background: #f6f8fc; border-radius: 10px; padding: 8px 10px; }
  .det .kv b { display: block; font-size: 9.5px; color: var(--t3); font-weight: 400; margin-bottom: 2px; }
  .det .kv span { font-size: 13px; }
</style>
</head>
<body>

<header>
  <div class="brand"><img src="icon-192.png" alt=""><b>wit-go</b></div>
  <div class="wk">
    <div class="wkno"><b id="wkText">第 1 周</b><em id="wkTag" style="display:none">本周</em></div>
    <span id="wkDate">—</span>
  </div>
  <div class="acts">
    <button class="pill" id="btnNow" style="display:none">本周</button>
    <button class="ibtn" id="btnMenu" aria-label="菜单">⋯</button>
  </div>
</header>

<div class="body" id="body"></div>

<div class="mask" id="mask"></div>

<div class="sheet" id="menuSheet">
  <div class="grab"></div>
  <div class="shTitle">课表</div>
  <button class="opt" id="mImport">导入课表文件<small>从安卓版 wit-go 导出的 .json</small></button>
  <button class="opt" id="mWeek">跳到某一周<small id="mWeekSub">当前第 1 周</small></button>
  <button class="opt" id="mClear">清空课表<small>数据只在这台手机上，清空后需要重新导入</small></button>
</div>

<div class="sheet" id="weekSheet">
  <div class="grab"></div>
  <div class="shTitle">跳到哪一周</div>
  <div class="wks" id="wkGrid"></div>
</div>

<div class="sheet" id="detSheet">
  <div class="grab"></div>
  <div class="det" id="detBody"></div>
</div>

<input type="file" id="file" accept=".json,application/json" style="display:none">

<script>
(function () {
  'use strict';

  var KEY = 'witgo.kb.v1';
  var DOW = ['一', '二', '三', '四', '五', '六', '日'];
  var DEFAULT_PERIODS = [
    ['08:00', '08:45'], ['08:50', '09:35'], ['09:55', '10:40'], ['10:45', '11:30'],
    ['11:35', '12:20'], ['14:00', '14:45'], ['14:50', '15:35'], ['15:55', '16:40'],
    ['16:45', '17:30'], ['19:00', '19:45'], ['19:50', '20:35'], ['20:40', '21:25']
  ];

  var DATA = null;      // {term,maxWeek,week1Monday,timeRows,courses,remarks}
  var PERIODS = [];     // [{s:'08:00',e:'08:45'}...]
  var LAST = 18;
  var WEEK1 = null;     // Date
  var cur = 1;

  var body = document.getElementById('body');
  var wkText = document.getElementById('wkText');
  var wkDate = document.getElementById('wkDate');
  var wkTag = document.getElementById('wkTag');
  var btnNow = document.getElementById('btnNow');

  /* ---------- 工具 ---------- */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function mondayOf(d) {
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var dow = (x.getDay() + 6) % 7;
    x.setDate(x.getDate() - dow);
    return x;
  }
  function parseDay(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
    if (!m) return null;
    return new Date(+m[1], +m[2] - 1, +m[3]);
  }
  function addDays(d, n) {
    var x = new Date(d.getTime());
    x.setDate(x.getDate() + n);
    return x;
  }
  function md(d) { return (d.getMonth() + 1) + '.' + d.getDate(); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function currentWeek() {
    if (!WEEK1) return 1;
    var a = mondayOf(new Date()).getTime();
    var b = WEEK1.getTime();
    return Math.floor(Math.round((a - b) / 86400000) / 7) + 1;
  }

  /* ---------- 节次时间 ---------- */
  function buildPeriods(rows) {
    var out = [];
    (rows || []).forEach(function (r) {
      var m = /(\d{1,2})\s*:\s*(\d{2})\s*-\s*(\d{1,2})\s*:\s*(\d{2})/.exec(String(r.text || r));
      if (!m) return;
      var cnt = 1;
      var pm = /第\s*([\d]+)\s*节/.exec(String(r.text || ''));
      if (pm) cnt = pm[1].length;
      var start = +m[1] * 60 + +m[2];
      var end = +m[3] * 60 + +m[4];
      var dur = 45, gap = 5;
      if (cnt > 1 && end - start !== cnt * dur + (cnt - 1) * gap) {
        var span = Math.floor((end - start) / cnt);
        dur = Math.max(30, span - 5);
      }
      for (var i = 0; i < cnt; i++) {
        var s = start + i * (dur + gap);
        out.push({ s: hhmm(s), e: hhmm(s + dur) });
      }
    });
    return out.length ? out : DEFAULT_PERIODS.map(function (p) { return { s: p[0], e: p[1] }; });
  }
  function hhmm(min) { return pad(Math.floor(min / 60)) + ':' + pad(min % 60); }

  /* ---------- 数据 ---------- */
  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
    if (!raw) { DATA = null; return; }
    try {
      var o = JSON.parse(raw);
      DATA = (o && o.data) ? o.data : o;
      if (!DATA || !DATA.courses || !DATA.courses.length) DATA = null;
    } catch (e) { DATA = null; }
  }
  function save(d) {
    try { localStorage.setItem(KEY, JSON.stringify({ app: 'wit-go', kind: 'kbtable', schema: 1, data: d })); } catch (e) { }
  }
  function prepare() {
    PERIODS = buildPeriods(DATA && DATA.timeRows);
    LAST = (DATA && DATA.maxWeek) || 18;
    WEEK1 = parseDay(DATA && DATA.week1Monday) || mondayOf(new Date());
    cur = Math.min(Math.max(currentWeek(), 1), LAST);
  }

  /* ---------- 渲染 ---------- */
  function colorIdx(name) {
    var h = 0, s2 = String(name || '');
    for (var i = 0; i < s2.length; i++) h = (h * 31 + s2.charCodeAt(i)) & 0xffff;
    return h % 6;
  }
  function courseOn(c, week) {
    var ws = c.weeks || [];
    for (var i = 0; i < ws.length; i++) if (+ws[i] === week) return true;
    return false;
  }

  function render() {
    if (!DATA) { renderEmpty(); return; }
    var n = PERIODS.length;
    var today = new Date();
    var todayIdx = (today.getDay() + 6) % 7;
    var isThis = cur === currentWeek();

    wkText.textContent = cur < 1 ? '开学前' : (cur > LAST ? '放假中' : '第 ' + cur + ' 周');
    var mon = addDays(WEEK1, (cur - 1) * 7);
    wkDate.textContent = (cur < 1 || cur > LAST) ? '' : md(mon) + ' - ' + md(addDays(mon, 6));
    wkTag.style.display = isThis ? '' : 'none';
    btnNow.style.display = isThis ? 'none' : '';

    var html = '<div class="grid">';

    // 星期行
    html += '<div class="dow"><div class="corner"></div>';
    for (var d = 0; d < 7; d++) {
      var dd = addDays(mon, d);
      var cls = (isThis && d === todayIdx) ? 'dh today' : 'dh';
      html += '<div class="' + cls + '"><b>' + DOW[d] + '</b><span>' + md(dd) + '</span></div>';
    }
    html += '</div>';

    // 12 节主体
    html += '<div class="rows">';
    html += '<div class="gutter">';
    for (var p = 0; p < n; p++) {
      html += '<div class="gl" style="top:' + (p * 100 / n) + '%;height:' + (100 / n) + '%">'
        + '<b>' + (p + 1) + '</b>' + PERIODS[p].s + '<br>' + PERIODS[p].e + '</div>';
    }
    html += '</div>';

    html += '<div class="cols">';
    for (var d2 = 0; d2 < 7; d2++) {
      var cc = (isThis && d2 === todayIdx) ? 'col today' : 'col';
      html += '<div class="' + cc + '">';
      var list = (DATA.courses || []).filter(function (c) {
        return (+c.day === d2 + 1) && courseOn(c, cur);
      });
      list.sort(function (a, b) { return Math.min.apply(null, a.periods) - Math.min.apply(null, b.periods); });
      // 车道分配（简单贪心）
      var lanes = [];
      list.forEach(function (c) {
        var s = Math.min.apply(null, c.periods), e = Math.max.apply(null, c.periods);
        var lane = 0, ok = false;
        while (!ok) {
          ok = true;
          for (var i = 0; i < lanes.length; i++) {
            var L = lanes[i];
            if (L.lane === lane && !(e < L.s || s > L.e)) { ok = false; break; }
          }
          if (!ok) lane++;
        }
        lanes.push({ lane: lane, s: s, e: e, c: c });
      });
      lanes.forEach(function (L) {
        var cnt = 0;
        lanes.forEach(function (M) { if (M.lane > cnt) cnt = M.lane; });
        var width = 100 / (cnt + 1);
        var top = (L.s - 1) * 100 / n;
        var h = (L.e - L.s + 1) * 100 / n;
        var c = L.c;
        var fs = (L.e - L.s + 1) >= 3 ? 5 : ((L.e - L.s + 1) === 2 ? 4 : 3);
        html += '<div class="blk" data-c="' + colorIdx(c.name) + '" data-i="' + (DATA.courses.indexOf(c)) + '"'
          + ' style="top:calc(' + top + '% + 1px);height:calc(' + h + '% - 2px);'
          + 'left:calc(' + (L.lane * width) + '% + 1px);width:calc(' + width + '% - 2px)">'
          + '<div class="nm" style="-webkit-line-clamp:' + fs + '">' + esc(c.name) + '</div>'
          + (c.room ? '<div class="rm">' + esc(String(c.room).replace(/[（(].*$/, '')) + '</div>' : '')
          + (c.teacher ? '<div class="tc">' + esc(c.teacher) + '</div>' : '')
          + '</div>';
      });
      html += '</div>';
    }
    html += '</div></div></div>';

    // 底栏
    if (cur < 1) html += '';
    html += '<div class="foot">' + (cur < 1 ? '还没开学' : (cur > LAST ? '这学期已经结束了' : '<b id="footNum"></b>')) + '</div>';

    body.innerHTML = html;
    var fn = document.getElementById('footNum');
    if (fn) {
      var cnt2 = (DATA.courses || []).filter(function (c) { return courseOn(c, cur); }).length;
      fn.textContent = '本学期 ' + (DATA.term || '') + ' · 本周 ' + cnt2 + ' 节 · 左右滑动换周';
    }
    bindBlocks();
  }

  function renderEmpty() {
    wkText.textContent = '';
    wkDate.textContent = '';
    wkTag.style.display = 'none';
    btnNow.style.display = 'none';
    body.innerHTML = '<div class="empty">'
      + '<img src="icon-192.png" alt="">'
      + '<h2>先导入一份课表</h2>'
      + '<p>安卓版 wit-go 里：课表右上角「导出」→「导出为文件」，把那个 <b>.json</b> 传到这台手机，然后在这里选中它。</p>'
      + '<button class="cta" id="btnPick">选文件</button>'
      + '</div>';
    var b = document.getElementById('btnPick');
    if (b) b.onclick = pickFile;
  }

  function bindBlocks() {
    var blks = body.querySelectorAll('.blk');
    for (var i = 0; i < blks.length; i++) {
      blks[i].onclick = function () {
        var idx = +this.getAttribute('data-i');
        openDetail(DATA.courses[idx]);
      };
    }
  }

  /* ---------- 详情 ---------- */
  function openDetail(c) {
    var s = Math.min.apply(null, c.periods), e = Math.max.apply(null, c.periods);
    var t1 = PERIODS[s - 1] ? PERIODS[s - 1].s : '';
    var t2 = PERIODS[e - 1] ? PERIODS[e - 1].e : '';
    document.getElementById('detBody').innerHTML =
      '<h3>' + esc(c.name) + '</h3>'
      + '<div class="sub">星期' + DOW[(+c.day - 1)] + ' 第 ' + s + '-' + e + ' 节</div>'
      + '<div class="time">' + t1 + ' - ' + t2 + '<small>共 ' + (e - s + 1) + ' 节</small></div>'
      + '<div class="kv">'
      + '<div><b>上课周次</b><span>' + (c.weeks || []).join(',') + ' 周</span></div>'
      + '<div><b>教室</b><span>' + esc(c.room || '—') + '</span></div>'
      + '<div><b>教师</b><span>' + esc(c.teacher || '—') + '</span></div>'
      + '<div><b>本课次数</b><span>' + ((c.weeks || []).length) + ' 周有课</span></div>'
      + '</div>';
    show('detSheet');
  }

  /* ---------- 面板 ---------- */
  var opened = null;
  function show(id) {
    closeAll();
    opened = id;
    document.getElementById(id).classList.add('on');
    document.getElementById('mask').classList.add('on');
  }
  function closeAll() {
    ['menuSheet', 'weekSheet', 'detSheet'].forEach(function (i) {
      document.getElementById(i).classList.remove('on');
    });
    document.getElementById('mask').classList.remove('on');
    opened = null;
  }
  document.getElementById('mask').onclick = closeAll;

  document.getElementById('btnMenu').onclick = function () {
    if (!DATA) { pickFile(); return; }
    document.getElementById('mWeekSub').textContent = '当前第 ' + cur + ' 周';
    show('menuSheet');
  };
  btnNow.onclick = function () {
    cur = Math.min(Math.max(currentWeek(), 1), LAST);
    render();
  };

  /* 菜单项 */
  document.getElementById('mImport').onclick = function () { closeAll(); pickFile(); };
  document.getElementById('mWeek').onclick = function () { buildWeekGrid(); show('weekSheet'); };
  document.getElementById('mClear').onclick = function () {
    if (!confirm('清空后会变成空白课表，确定？')) return;
    try { localStorage.removeItem(KEY); } catch (e) { }
    DATA = null; closeAll(); render();
  };

  function buildWeekGrid() {
    var g = document.getElementById('wkGrid');
    var h = '<button class="wkcell" data-w="0">开学前</button>';
    for (var w = 1; w <= LAST; w++) {
      h += '<button class="wkcell' + (w === cur ? ' cur' : '') + '" data-w="' + w + '">' + w + '</button>';
    }
    h += '<button class="wkcell" data-w="' + (LAST + 1) + '">放假</button>';
    g.innerHTML = h;
    var cells = g.querySelectorAll('.wkcell');
    for (var i = 0; i < cells.length; i++) {
      cells[i].onclick = function () {
        cur = +this.getAttribute('data-w');
        closeAll();
        render();
      };
    }
  }

  /* ---------- 导入文件 ---------- */
  var fileInput = document.getElementById('file');
  function pickFile() { fileInput.value = ''; fileInput.click(); }
  fileInput.onchange = function () {
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      var d = null;
      try {
        var o = JSON.parse(String(rd.result));
        d = (o && o.data) ? o.data : o;
      } catch (e) { d = null; }
      if (!d || !d.courses || !d.courses.length) {
        alert('这不是 wit-go 导出的课表文件');
        return;
      }
      DATA = d;
      save(d);
      prepare();
      cur = Math.min(Math.max((+d.curWeek || currentWeek()), 1), LAST);
      render();
    };
    rd.readAsText(f, 'UTF-8');
  };

  /* ---------- 左右滑动换周 ---------- */
  var sx = 0, sy = 0, tracking = false, swiped = false;
  body.addEventListener('touchstart', function (e) {
    if (!DATA || e.touches.length !== 1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    tracking = true; swiped = false;
  }, { passive: true });
  body.addEventListener('touchmove', function (e) {
    if (!tracking) return;
    var dx = e.touches[0].clientX - sx;
    var dy = e.touches[0].clientY - sy;
    if (Math.abs(dx) > 24 && Math.abs(dx) > Math.abs(dy) * 1.4 && !swiped) {
      swiped = true;
      var next = dx < 0 ? cur + 1 : cur - 1;
      next = Math.min(Math.max(next, 0), LAST + 1);
      if (next !== cur) { cur = next; render(); }
    }
  }, { passive: true });
  body.addEventListener('touchend', function () { tracking = false; }, { passive: true });

  /* ---------- 启动 ---------- */
  load();
  if (DATA) { prepare(); render(); } else { renderEmpty(); }

  // 测试用：?demo=./sample.json
  var m = /[?&]demo=([^&]+)/.exec(location.search);
  if (m) {
    fetch(decodeURIComponent(m[1])).then(function (r) { return r.json(); })
      .then(function (o) {
        DATA = (o && o.data) ? o.data : o;
        prepare(); render();
      }).catch(function () { });
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { });
    });
  }
})();
</script>
</body>
</html>
